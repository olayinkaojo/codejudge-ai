name: Python CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codejudge
          POSTGRES_PASSWORD: codejudge
          POSTGRES_DB: codejudge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U codejudge -d codejudge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://codejudge:codejudge@localhost:5432/codejudge_test
      TEST_DATABASE_URL: postgresql+psycopg://codejudge:codejudge@localhost:5432/codejudge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base && alembic upgrade head
      - run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=85
      - run: docker build --target production -t codejudge:ci .
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait
      - run: python scripts/smoke.py --restart-api
      - if: always()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down -v
