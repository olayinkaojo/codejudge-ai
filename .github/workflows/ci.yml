name: Python CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codejudge
          POSTGRES_PASSWORD: codejudge
          POSTGRES_DB: codejudge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U codejudge -d codejudge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://codejudge:codejudge@localhost:5432/codejudge_test
      TEST_DATABASE_URL: postgresql+psycopg://codejudge:codejudge@localhost:5432/codejudge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base && alembic upgrade head
      - name: Validate migration of populated legacy rows
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          from app.config import get_settings
          with create_engine(get_settings().database_url, isolation_level='AUTOCOMMIT').connect() as db:
              db.execute(text('CREATE DATABASE codejudge_migration_test'))
          PY
          DATABASE_URL=postgresql+psycopg://codejudge:codejudge@localhost:5432/codejudge_migration_test python -m scripts.validate_migrations
      - run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=85
      - run: docker build --target production -t codejudge:ci .
      - run: docker build -t codejudge-python:ci runner/guest
      # Building the guest image is not execution admission; default hosted CI never runs submissions.
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait
      - run: python scripts/smoke.py --restart-api
      - if: always()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down -v
  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codejudge
          POSTGRES_PASSWORD: codejudge
          POSTGRES_DB: codejudge_ui_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U codejudge -d codejudge_ui_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://codejudge:codejudge@localhost:5432/codejudge_ui_test
      BACKEND_URL: http://127.0.0.1:8000
      APP_ORIGIN: http://localhost:3000
      SANDBOX_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - name: Start API and worker
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/codejudge-ui-api.log 2>&1 &
          python -m app.worker > /tmp/codejudge-ui-worker.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/ready') as response:
                      assert response.status == 200
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run format:check && npm test && npm run build && npm run typecheck
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-browser-failures
          path: frontend/test-results/
          retention-days: 3
